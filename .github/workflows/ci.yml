name: ci

# Build the Knoodle command-line tools from the Makefile and run the light-tier
# internal tests, across the same platforms the designbynumbers/cantarellalab
# Homebrew formula targets -- but with NATIVE toolchains (brew-deps-only / apt /
# dnf) instead of `brew install knoodle`. The point is to catch portability
# breakage HERE, in the source repo, before it reaches a downstream tap PR. The
# brew formula's own CI keeps the packaging-specific checks (e.g. the KLUT landing
# in the right pkgshare); this repo just proves "the tools build and the internal
# tests pass" on each platform.
#
# Compiler mapping (chosen to dodge HenrikSchumacher/Knoodle#15, the gcc-13/14
# function_traits<bool*> bug):
#   * macOS         -> Apple clang (the tools/Makefile Darwin path)
#   * ubuntu-latest -> clang + -DTOOLS_NO_RESTRICT (the cluster/paclet path;
#                      Ubuntu's system gcc would hit #15)
#   * fedora:latest -> gcc-15 (recent gcc, the working brew-on-Linux config)
#   * rockylinux:9  -> clang (Rocky's system gcc is 11; distro clang builds fine),
#                      Sapelo2-cluster (Rocky 9.x) proxy
#
# Light tier only: the three tools + --help smoke, then the light-tier test
# drivers that need no UMFPACK/BLAS (see scripts/ci-build-and-test.sh). The KLUT
# tables (data/Klut, Git LFS, ~24 MB) are fetched, cached on the host runners, so
# knoodleidentify really identifies; the rest of the LFS data (data/diagrams) is
# not. The heavy UMFPACK tier is out of scope.

# docs/ is skipped: nothing that is built or tested reads it (README.md and
# CITATION.cff ship in the release tarball, so those still run).
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**"]
  pull_request:
    paths-ignore: ["docs/**"]
  schedule:
    # 1st of each month, 06:00 UTC: catch breakage from a new runner image /
    # toolchain even with no pushes (mirrors the tap's monthly cron).
    - cron: "0 6 1 * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Host runners: macOS (Apple clang) + Ubuntu (clang). Runs on every PR.
  native:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-26 (Apple clang)
            os: macos-26
          # The older Apple toolchain: the macos-15 image's default Xcode 16.4
          # (Apple clang 17), which is what macOS 15 users build with. A regular
          # leg since 2026-11-09. It was an informational tripwire while Clang 17
          # lacked floating-point std::from_chars, and it had been passing since
          # at least 2026-08-06 without anyone noticing. If it starts failing
          # again, decide then whether to make it informational again or drop it.
          # GitHub sometimes cannot find a macOS runner, and the job is then
          # cancelled ("not acquired by Runner"); re-run it.
          - name: macos-15 (Apple clang 17, Xcode 16.4)
            os: macos-15
          - name: ubuntu-latest (clang)
            os: ubuntu-latest
            cxx: "clang++ -DTOOLS_NO_RESTRICT"
            homebrew_prefix: /usr
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Fetch submodules (ssh->https, no LFS)
        # .gitmodules uses git@github.com: SSH URLs and Tensors nests Tools, so
        # rewrite to https and init recursively. The submodules need no LFS.
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: List the KLUT tables' LFS objects (the cache key)
        run: git lfs ls-files --long --include="data/Klut/**" | cut -d' ' -f1 | sort > .klut-lfs-oids

      - name: Restore the KLUT tables' LFS objects
        # Saves LFS bandwidth: the tables change rarely, so most runs download
        # nothing. A new table set gets a new key.
        uses: actions/cache@v4
        with:
          path: .git/lfs/objects
          key: klut-lfs-${{ runner.os }}-${{ hashFiles('.klut-lfs-oids') }}

      - name: Fetch the KLUT tables (Git LFS, data/Klut only)
        run: bash scripts/ci-fetch-klut.sh

      - name: Install deps (macOS -- Boost + SuiteSparse + ccache)
        if: runner.os == 'macOS'
        run: brew install boost suite-sparse ccache

      - name: Install deps (Ubuntu -- clang + Boost + SuiteSparse + ccache)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang make libboost-dev libsuitesparse-dev python3 ccache

      - name: Name this runner's CPU (part of the compiler-cache key)
        # The build uses -march=native, and ccache sees only the word "native":
        # an object cached on one CPU would be handed to another that may not
        # have its instructions. So each CPU model gets its own cache.
        run: |
          { sysctl -n machdep.cpu.brand_string 2>/dev/null \
              || grep -m1 'model name' /proc/cpuinfo; } > .ci-cpu-model
          cat .ci-cpu-model

      - name: Restore the compiler cache (test groups)
        # test/Makefile uses ccache for the group compiles when it is on PATH.
        # A push that did not change what a group includes then recompiles
        # nothing for it. Saved per commit, restored from the newest earlier one.
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.os }}-${{ hashFiles('.ci-cpu-model') }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.os }}-${{ hashFiles('.ci-cpu-model') }}-

      - name: Build tools + run light-tier tests
        env:
          CI_CXX: ${{ matrix.cxx }}
          HOMEBREW_PREFIX: ${{ matrix.homebrew_prefix }}
          CI_TEST_TARGET: ${{ github.event_name == 'pull_request' && 'light' || 'all' }}
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 400M
          # Compare compilers by content, not mtime: every runner is a fresh
          # image, so the mtime never matches and nothing would ever hit.
          CCACHE_COMPILERCHECK: content
        run: bash scripts/ci-build-and-test.sh

  # RHEL-family + Debian coverage (no native Fedora/RHEL/Debian runner exists), as
  # containers on ubuntu-latest -- fedora:latest for recent gcc, rockylinux:9 as
  # the Sapelo2 cluster proxy, debian:bookworm for Debian-stable user installs. Skipped on pull_request to keep PR CI fast (each does a full dnf
  # toolchain install); push/cron/dispatch coverage is enough since we bump on main.
  rpm:
    name: ${{ matrix.name }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fedora:latest (gcc)
            container: "fedora:latest"
            cxx: "g++"
          - name: rockylinux:9 (clang)
            container: "rockylinux:9"
            cxx: "clang++ -DTOOLS_NO_RESTRICT"
            # Rocky 9's Boost is 1.75 (< 1.81, no unordered_flat_map), so build the
            # tools without the boost flat-map define -- as the Sapelo2 cluster does.
            no_boost: "1"
    container:
      image: ${{ matrix.container }}
    env:
      HOMEBREW_PREFIX: /usr
      CI_CXX: ${{ matrix.cxx }}
      CI_NO_BOOST: ${{ matrix.no_boost }}
    steps:
      - name: Install toolchain + deps (Fedora)
        if: startsWith(matrix.container, 'fedora')
        # gcc-c++ (gcc 15), make, git (for checkout + submodules), Boost +
        # SuiteSparse (umfpack.h under /usr/include/suitesparse), python3.
        run: |
          dnf -y install gcc-c++ make git git-lfs boost-devel suitesparse-devel \
                         python3 findutils

      - name: Install toolchain + deps (Rocky 9)
        if: startsWith(matrix.container, 'rockylinux')
        # SuiteSparse lives in EPEL/CRB on Rocky, so enable them first. Build with
        # distro clang (system gcc is 11).
        run: |
          dnf -y install epel-release dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf -y install clang make git git-lfs boost-devel suitesparse-devel \
                         python3 findutils

      - name: Check out
        uses: actions/checkout@v4

      - name: Fetch submodules (ssh->https, no LFS)
        run: |
          git config --global --add safe.directory '*'
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Fetch the KLUT tables (Git LFS, data/Klut only)
        # No cache in the containers: these jobs run on push/cron only.
        run: bash scripts/ci-fetch-klut.sh

      - name: Build tools + run light-tier tests
        env:
          CI_TEST_TARGET: all
        run: bash scripts/ci-build-and-test.sh

  # Debian stable (bookworm), MANUAL ONLY for now (Actions -> ci -> "Run workflow",
  # or `gh workflow run ci.yml --ref <branch>`): not on push/PR/cron until the
  # initial slew of bookworm problems is fixed, then fold into the always-on
  # matrix. Added 2026-08-28 after a user's from-source install on bookworm broke.
  #
  # Bookworm's stock toolchain (clang 14 / gcc 12, libstdc++ 12) cannot build the
  # tools: no std::format and no C++20 implicit-typename (P0634, clang >= 16); its
  # gcc 13/14 would hit HenrikSchumacher/Knoodle#15. Two legs:
  #   * stock clang -- informational tripwire (expected fail; goes green if
  #     upstream ever gains fallbacks);
  #   * clang-19 from apt.llvm.org + libc++ -- the recipe we tell bookworm users.
  # Boost 1.74 < 1.81 (no unordered_flat_map) => no_boost, like Rocky.
  debian:
    name: ${{ matrix.name }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian:bookworm (stock clang 14, tripwire, expected fail)
            cxx: "clang++ -DTOOLS_NO_RESTRICT"
            experimental: true
          - name: debian:bookworm (clang-19 apt.llvm.org, libc++)
            # Bookworm's Boost 1.74 container_hash still uses std::unary_function,
            # which libc++ 17+ removes; the _LIBCPP_ENABLE_* macro re-enables it.
            cxx: "clang++-19 -stdlib=libc++ -D_LIBCPP_ENABLE_CXX17_REMOVED_UNARY_BINARY_FUNCTION -DTOOLS_NO_RESTRICT"
            llvm: "19"
    container:
      image: debian:bookworm
    continue-on-error: ${{ matrix.experimental == true }}
    env:
      HOMEBREW_PREFIX: /usr
      CI_CXX: ${{ matrix.cxx }}
      CI_NO_BOOST: "1"
    steps:
      - name: Install toolchain + deps
        # Bare debian image: git + ca-certificates are needed by actions/checkout.
        # With matrix.llvm set, add apt.llvm.org and install that clang + libc++.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            clang make git git-lfs ca-certificates curl gnupg libboost-dev \
            libsuitesparse-dev python3
          if [ -n "${{ matrix.llvm }}" ]; then
            V="${{ matrix.llvm }}"
            curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
              | gpg --dearmor -o /usr/share/keyrings/llvm.gpg
            echo "deb [signed-by=/usr/share/keyrings/llvm.gpg] https://apt.llvm.org/bookworm/ llvm-toolchain-bookworm-$V main" \
              > /etc/apt/sources.list.d/llvm.list
            apt-get update
            apt-get install -y --no-install-recommends \
              clang-$V libc++-$V-dev libc++abi-$V-dev
          fi

      - name: Check out
        uses: actions/checkout@v4

      - name: Fetch submodules (ssh->https, no LFS)
        run: |
          git config --global --add safe.directory '*'
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Fetch the KLUT tables (Git LFS, data/Klut only)
        run: bash scripts/ci-fetch-klut.sh

      - name: Build tools + run light-tier tests
        run: bash scripts/ci-build-and-test.sh
