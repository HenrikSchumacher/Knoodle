<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knoodle player</title>
<!--
  A player for knoodle-animation version 2 files (src/Animate/Json.hpp).
  One file, no dependencies, no build step. Open it in a browser and drop an
  animation on it, or serve it beside one:  knoodle-player.html#file.json

  The picture is a port of src/Animate/Frame.hpp, function for function. That
  file is the reference: when the two differ, this one is wrong.

  For other pages:  KnoodlePlayer.load(json), .seek(seconds), .setStyle({...}),
  and KnoodleAnimation.frameAt(animation, seconds, style, width, height).
-->
<style>
  :root { --page: #f4f4f8; --text: #222; --muted: #667; --line: #c9cbe0; --accent: #1B1F8A; }
  @media (prefers-color-scheme: dark) { :root { --page: #14171c; --text: #dde; --muted: #99a; --line: #333a46; --accent: #9aa2ff; } }
  html, body { height: 100%; }
  body { margin: 0; background: var(--page); color: var(--text); font: 15px/1.4 system-ui, sans-serif; display: flex; flex-direction: column; }
  main { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 12px; }
  canvas { max-width: 100%; max-height: 100%; aspect-ratio: 16 / 9; width: 100%; border: 1px solid var(--line); background: #fff; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 8px 12px; border-top: 1px solid var(--line); }
  .bar input[type=range] { flex: 1; min-width: 140px; accent-color: var(--accent); }
  button, select { font: inherit; padding: 3px 10px; border: 1px solid var(--line); background: transparent; color: inherit; border-radius: 4px; cursor: pointer; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #label { font-weight: 600; min-width: 11em; }
  #count, #clock, #note { color: var(--muted); font-variant-numeric: tabular-nums; }
  #note { flex-basis: 100%; min-height: 1.4em; }
  label { display: inline-flex; gap: 6px; align-items: center; }
  input[type=color] { width: 28px; height: 22px; padding: 0; border: 1px solid var(--line); background: none; }
  body.drop canvas { outline: 3px dashed var(--accent); }
</style>
</head>
<body>
<main><canvas id="view" width="1600" height="900"></canvas></main>
<div class="bar">
  <button id="play">Play</button>
  <button id="prev" title="Previous scene">&#9664;</button>
  <button id="next" title="Next scene">&#9654;</button>
  <input id="time" type="range" min="0" max="1" step="0.001" value="0" aria-label="Time">
  <span id="clock">0.0 / 0.0 s</span>
  <label>Speed <select id="speed"><option value="0.25">&frac14;&times;</option><option value="0.5">&frac12;&times;</option><option value="1" selected>1&times;</option><option value="2">2&times;</option></select></label>
</div>
<div class="bar">
  <span id="label">No animation loaded</span><span id="count"></span>
  <label>Theme <select id="theme"><option value="talk">Talk</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
  <label>Ground <input id="c_background" type="color"></label>
  <label>Ink <input id="c_ink" type="color"></label>
  <label>Moving <input id="c_moving" type="color"></label>
  <label>Disk <input id="c_disk" type="color"><input id="a_disk" type="range" min="0" max="1" step="0.05" style="flex:0 0 70px;min-width:70px" aria-label="Disk opacity"></label>
  <button id="open">Open&hellip;</button><input id="file" type="file" accept=".json,application/json" hidden>
  <span id="note">Drop a knoodle-animation file here.</span>
</div>

<script id="core">

    disk: [0.820,0.827,0.949,0.75], fog: [0.86,0.87,0.95,1], components: [],
    stroke: 0.28, min_stroke: 1 / 128, route_width: 0.8, gap: 1.7, fog_depth: 0.55, fog_width: 0.35, margin: 0.06, token_stroke: 1 / 300 };

      components: [[0.18,0.18,0.18,1], [0.11,0.12,0.54,1], [0.80,0,0.17,1], [0,0.47,0.24,1]] },

        if (lerp(a[2], b[2], ta) < lerp(c[2], d[2], tc)) cuts[s.c].push([cum[s.c][s.i] + ta * la, st.gap * wpx * kk]);

    }
    // under the curves: the ball, faintly, and the marks
    const shape = (rings, c, alpha) => { const col = [c[0], c[1], c[2], c[3] * alpha]; if (col[3] > 0) f.items.push({ fill: true, rings, color: col }); };
    const outline = (ring, c, alpha, width) => { const col = [c[0], c[1], c[2], c[3] * alpha]; if (col[3] > 0 && ring.length >= 2) f.items.push({ fill: false, pts: ring, color: col, width, round: true, closed: true }); };
    const seen = X => V.world(X[0] - sc.Tilt[0] * X[2], X[1] - sc.Tilt[1] * X[2]);
    if (S.Map === 'Roll' && roll > 0.3 && fog > 0) {
      const R = S.Radius / roll, vl = Math.sqrt(sc.Tilt[0] * sc.Tilt[0] + sc.Tilt[1] * sc.Tilt[1] + 1), v = [sc.Tilt[0] / vl, sc.Tilt[1] / vl, 1 / vl];
      const el = Math.hypot(v[2], v[1]), e1 = [0, v[2] / el, -v[1] / el], e2 = [v[1] * e1[2] - v[2] * e1[1], v[2] * e1[0] - v[0] * e1[2], v[0] * e1[1] - v[1] * e1[0]];
      const ring = [];
      for (let i = 0; i < 96; i++) { const a = 6.283185307179586 * i / 96, c = Math.cos(a), s = Math.sin(a);
        ring.push(seen([S.Centre[0] + R * (c * e1[0] + s * e2[0]), S.Centre[1] + R * (c * e1[1] + s * e2[1]), R + R * (c * e1[2] + s * e2[2])])); }
      const show = fog * clamp((roll - 0.3) / 0.4, 0, 1);
      shape([ring], st.fog, 0.30 * show); outline(ring, st.fog, show, 0.6 * wpx);
    }
    if (S.Marks) {
      const mIn = lerp(S.MarkIn[0], S.MarkIn[1], u), mOut = lerp(S.MarkOut[0], S.MarkOut[1], u), mLine = lerp(S.MarkLine[0], S.MarkLine[1], u);
      for (const m of S.Marks) {
        const ring = m.map(p => seen(stagePoint(S, p, angle, lift, roll, fin, false)));
        if (ring.length < 3) continue;
        shape([ring], st.disk, mIn);
        if (mOut > 0) {
          let area = 0; ring.forEach((a, i) => { const b = ring[(i + 1) % ring.length]; area += a[0] * b[1] - b[0] * a[1]; });
          const hole = ring.slice(); if (area > 0) hole.reverse();
          shape([[[0, 0], [f.width, 0], [f.width, f.height], [0, f.height]], hole], st.disk, mOut);
        }
        outline(ring, st.route, mLine, 2.4 * wpx);
      }
    }
    const LEVELS = 24, span = Math.max(dmax - dmin, 1e-12), dmid = (dmin + dmax) / 2, depth = Math.max(sc.Depth, 1e-12), runs = [];
    for (let c = 0; c < nc; c++) {
      if (px[c].length < 2) continue;
      let k2 = kept(cuts[c], cum[c][cum[c].length - 1], true); if (k2 === null) k2 = [[0, cum[c][cum[c].length - 1]]];
      const baseCol = colorOf(st, 'Strand', S.Curves[c].Color);
      for (const [a, b] of k2) {
        const piece = subCurve(px[c], cum[c], true, a, b); let band = -1;
        for (let i = 0; i + 1 < piece.length; i++) {
          const d = (piece[i][2] + piece[i + 1][2]) / 2, nb = fog > 0 ? Math.min(LEVELS - 1, Math.floor(LEVELS * (d - dmin) / span)) : 0;
          if (nb !== band) {
            const far = clamp((dmax - d) / (2 * depth), 0, 1);
            runs.push({ band: nb, pts: [piece[i]], color: mix(baseCol, [st.fog[0], st.fog[1], st.fog[2], baseCol[3]], st.fog_depth * fog * far),
              width: wpx * (1 + st.fog_width * fog * clamp((d - dmid) / depth, -1, 1)) });
            band = nb;
          }
          runs[runs.length - 1].pts.push(piece[i + 1]);
        }
      }
    }
    runs.map((r, i) => [r, i]).sort((a, b) => a[0].band - b[0].band || a[1] - b[1]).forEach(([r]) => pushStroke(f, r.pts, r.color, r.width, true, false));
  }

  const duration = A => A.Scenes.reduce((t, s) => t + s.Duration, 0);
  function locate(A, t) {
    if (!A.Scenes.length) return null;
    if (t < 0) t = 0;
    for (let i = 0; i < A.Scenes.length; i++) {
      const d = A.Scenes[i].Duration;
      if (t < d || i + 1 === A.Scenes.length) return { scene: i, local: t < d ? t : d };
      t -= d;
    }
    return null;
  }
  function frameAt(A, seconds, st, width, height) {
    const f = { width, height, background: st.background, items: [], scene: 0, label: '', note: '', crossings: [0, 0] };
    const at = locate(A, seconds); if (!at) return f;
    const sc = A.Scenes[at.scene];
    f.scene = at.scene; f.label = sc.Label; f.note = sc.Note || ''; f.crossings = sc.Crossings;

  }
  const css = c => `rgba(${Math.round(c[0] * 255)},${Math.round(c[1] * 255)},${Math.round(c[2] * 255)},${c[3]})`;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = css(f.background); ctx.fillRect(0, 0, f.width, f.height);

      ctx.beginPath();
      for (const ring of (it.fill ? it.rings : [it.pts])) { ring.forEach((q, i) => i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1])); if (it.fill || it.closed) ctx.closePath(); }

    }
  }
  return { styles, frameAt, draw, duration, locate, stagePoint, finish, smoother };
})();
</script>

<script>
// ---------------------------------------------------------------------------
// The player: a canvas, a clock and a few controls.
// ---------------------------------------------------------------------------
const KnoodlePlayer = (() => {
  const $ = id => document.getElementById(id), cv = $('view'), ctx = cv.getContext('2d');
  let A = null, t = 0, playing = false, last = 0, style = { ...KnoodleAnimation.styles.talk };
  const hex = c => '#' + c.slice(0, 3).map(v => Math.round(v * 255).toString(16).padStart(2, '0')).join('');
  const unhex = (h, a) => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255).concat([a]);

  function render() {
    const total = A ? KnoodleAnimation.duration(A) : 0;
    $('time').max = total || 1; $('time').value = t;
    $('clock').textContent = `${t.toFixed(1)} / ${total.toFixed(1)} s`;
    if (!A) { ctx.fillStyle = hex(style.background); ctx.fillRect(0, 0, cv.width, cv.height); return; }
    const f = KnoodleAnimation.frameAt(A, t, style, cv.width, cv.height);
    KnoodleAnimation.draw(ctx, f);
    $('label').textContent = f.label || 'Scene ' + (f.scene + 1);
    $('count').textContent = f.crossings[0] === f.crossings[1] ? `${f.crossings[0]} crossings` : `${f.crossings[0]} → ${f.crossings[1]} crossings`;
    $('note').textContent = f.note;
  }
  function tick(now) {
    if (!playing) return;
    t += (now - last) / 1000 * +$('speed').value; last = now;
    if (A && t >= KnoodleAnimation.duration(A)) { t = KnoodleAnimation.duration(A); setPlaying(false); }
    render(); if (playing) requestAnimationFrame(tick);
  }
  function setPlaying(on) {
    playing = on && !!A; $('play').textContent = playing ? 'Pause' : 'Play';
    if (playing) { if (t >= KnoodleAnimation.duration(A)) t = 0; last = performance.now(); requestAnimationFrame(tick); }
  }
  function sceneStart(i) { let s = 0; for (let k = 0; k < i; k++) s += A.Scenes[k].Duration; return s; }
  function step(dir) {
    if (!A) return;
    const at = KnoodleAnimation.locate(A, t), here = sceneStart(at.scene);
    const i = dir > 0 ? Math.min(at.scene + 1, A.Scenes.length - 1) : (t - here > 0.3 ? at.scene : Math.max(at.scene - 1, 0));
    t = sceneStart(i); render();
  }
  function syncControls() {
    for (const k of ['background', 'ink', 'moving', 'disk']) $('c_' + k).value = hex(style[k]);
    $('a_disk').value = style.disk[3];
  }
  function load(json) {
    let a = json;
    if (typeof json === 'string') { try { a = JSON.parse(json); } catch (e) { throw new Error('This is not a knoodle-animation file (it is not JSON).'); } }
    if (a.Format !== 'knoodle-animation' || a.Version !== 2) throw new Error('This is not a knoodle-animation version 2 file.');
    A = a; t = 0; setPlaying(false); document.title = (a.Source || 'animation') + ' – Knoodle player'; render();
  }
  function fail(e) { $('note').textContent = e.message || String(e); }
  function setStyle(patch) { style = { ...style, ...patch }; syncControls(); render(); }

  $('play').onclick = () => setPlaying(!playing);
  $('prev').onclick = () => step(-1); $('next').onclick = () => step(1);
  $('time').oninput = () => { t = +$('time').value; render(); };
  $('theme').onchange = () => { style = { ...KnoodleAnimation.styles[$('theme').value] }; syncControls(); render(); };
  for (const k of ['background', 'ink', 'moving', 'disk']) $('c_' + k).oninput = () => { style[k] = unhex($('c_' + k).value, style[k][3]); render(); };
  $('a_disk').oninput = () => { style.disk = style.disk.slice(0, 3).concat([+$('a_disk').value]); render(); };
  $('open').onclick = () => $('file').click();
  $('file').onchange = () => { const f = $('file').files[0]; if (f) f.text().then(load).catch(fail); };
  addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('drop'); });
  addEventListener('dragleave', () => document.body.classList.remove('drop'));
  addEventListener('drop', e => { e.preventDefault(); document.body.classList.remove('drop'); const f = e.dataTransfer.files[0]; if (f) f.text().then(load).catch(fail); });
  addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if (e.key === ' ') { e.preventDefault(); setPlaying(!playing); } else if (e.key === 'ArrowLeft') step(-1); else if (e.key === 'ArrowRight') step(1);
  });
  syncControls(); render();
  // knoodle-player.html#file.json loads that file, now and whenever the address changes
  const fromAddress = () => {
    if (location.hash.length <= 1) return;
    const url = decodeURIComponent(location.hash.slice(1));
    fetch(url).then(r => { if (!r.ok) throw new Error(`Could not load ${url} (the server answered ${r.status}).`); return r.text(); }).then(load).catch(fail);
  };
  addEventListener('hashchange', fromAddress); fromAddress();
  return { load, setStyle, seek: s => { t = s; render(); }, play: () => setPlaying(true), pause: () => setPlaying(false) };
})();
</script>
